name: ST1 Connect - Security Regression

on:
  push:
    branches:
      - feature/st1-connect-bi-foundation
      - fix/st1-preview-google-master-qa-20261101
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run unit and authorization tests
        run: npm test
      - name: Validate TypeScript and Vite build
        run: npx tsc -b && npx vite build
